[package]
name = "tauri-plugin-native-video"
version = "0.1.0"
authors = [ "Photo Wall" ]
description = "Native H.264/AAC video export bridge for Photo Wall"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-native-video"

[dependencies]
tauri = { version = "2" }
serde = "1.0"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Foundation",
  "Media_Editing",
  "Media_MediaProperties",
  "Media_Transcoding",
  "Storage",
  "Storage_Streams"
] }
windows-future = { version = "0.2", features = ["std"] }

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }
