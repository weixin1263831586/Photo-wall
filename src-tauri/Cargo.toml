[package]
name = "photo-wall"
version = "1.0.0"
description = "本地照片拼贴墙"
authors = ["Photo Wall"]
edition = "2021"

[lib]
name = "photo_wall_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
